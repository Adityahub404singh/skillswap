    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --navy:#10243A; --midnight:#071827; --teal:#16B8A6; --gold:#D6B56D; --green:#10B981; --red:#EF4444; --muted:#64748B; --border:#E2E8F0; }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; background:linear-gradient(160deg,#F8FAFC,#EAF3F4); font-family:'Inter',sans-serif; color:#0F172A; display:flex; align-items:center; justify-content:center; padding:24px; }
        .card { width:100%; max-width:460px; background:#fff; border:1px solid var(--border); border-radius:28px; box-shadow:0 20px 50px rgba(16,36,58,.10); overflow:hidden; }
        .head { background:var(--midnight); padding:22px 26px; display:flex; align-items:center; gap:12px; border-bottom:3px solid var(--gold); }
        .head img { width:42px; height:42px; border-radius:11px; }
        .head b { font-family:'Space Grotesk',sans-serif; color:#fff; font-size:18px; letter-spacing:.02em; display:block; line-height:1.1; }
        .head small { color:var(--teal); font-size:11px; letter-spacing:.18em; font-weight:600; }
        .body { padding:32px 26px 28px; text-align:center; }
        .badge { width:72px; height:72px; border-radius:50%; margin:0 auto 16px; display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:700; }
        .ok .badge { background:rgba(16,185,129,.12); color:var(--green); }
        .bad .badge { background:rgba(239,68,68,.12); color:var(--red); }
        .load .badge { background:#F1F5F9; color:var(--muted); font-size:26px; }
        h1 { font-family:'Space Grotesk',sans-serif; font-size:22px; margin:0 0 6px; }
        .ok h1 { color:var(--green); } .bad h1 { color:var(--red); }
        p.note { color:var(--muted); font-size:13.5px; margin:0 0 22px; }
        .rows { text-align:left; background:#F8FAFC; border:1px solid var(--border); border-radius:18px; padding:6px 18px; }
        .row { display:flex; justify-content:space-between; gap:14px; padding:11px 0; border-bottom:1px solid #EDF2F7; font-size:14px; }
        .row:last-child { border-bottom:none; }
        .row span:first-child { color:var(--muted); }
        .row span:last-child { font-weight:700; text-align:right; word-break:break-word; }
        .mono { font-family:monospace; color:var(--teal); }
        a.btn { display:block; margin-top:22px; background:var(--navy); color:#fff; text-decoration:none; padding:15px; border-radius:16px; font-weight:700; font-size:14px; }
        .hidden { display:none; }
        .idle .badge { background:rgba(91,92,246,.10); color:#5B5CF6; font-size:28px; }
        form.lookup { margin-top:4px; display:flex; flex-direction:column; gap:12px; }
        form.lookup input { width:100%; font:600 15px 'Inter',sans-serif; padding:15px 18px; border:1px solid var(--border); border-radius:16px; background:#F8FAFC; text-align:center; letter-spacing:.04em; text-transform:uppercase; }
        form.lookup input:focus { outline:none; border-color:var(--teal); background:#fff; box-shadow:0 0 0 4px rgba(22,184,166,.12); }
        form.lookup button { border:none; cursor:pointer; background:var(--teal); color:#fff; padding:15px; border-radius:16px; font:700 14px 'Inter',sans-serif; }
        .hint { margin-top:16px; font-size:12px; color:var(--muted); }
    </style>
</head>
<body>

            <div><b>SkillSwap India</b><small>CERTIFICATE VERIFICATION</small></div>
        </div>
        <div class="body load" id="body">
            <div class="badge" id="badge">…</div>
            <h1 id="title">Verifying…</h1>
            <p class="note" id="note">Certificate record check kiya ja raha hai.</p>
            <div class="rows hidden" id="rows"></div>
            <form class="lookup hidden" id="lookup">
                <input id="idInput" placeholder="SWAP-IND-XXXXXX" autocomplete="off" required />
                <button type="submit">Verify Certificate</button>
            </form>
            <a class="btn" href="/">Visit SkillSwap →</a>
        </div>
    </div>

<script>
    // Wahi backend URL jo certificate.html ke API_BASE mein hai. Khaali = sirf local browser record.
    const API_BASE = '';

    const id = (new URLSearchParams(location.search).get('id') || '').trim();
    const el = (i) => document.getElementById(i);

    function show(state, title, note, data) {
        el('body').className = 'body ' + state;
        el('badge').textContent = state === 'ok' ? '✓' : state === 'bad' ? '✕' : '…';
        el('title').textContent = title;
        el('note').textContent = note;
        const rows = el('rows');
        rows.innerHTML = '';
        if (data) {
            const roleTxt = data.role === 'teacher' ? 'Master Mentor / Teacher' : 'Skilled Learner';
            const list = [
                ['Awarded To', data.name],
                ['Skill', data.skill],
                ['Track', roleTxt],
                ['Issued On', data.dateStr || data.issuedAt || '—'],
                ['Certificate ID', data.certId || id, true],
                ['Status', String(data.status || 'VALID').toUpperCase()]
            ];
            list.forEach(([k, v, mono]) => {
                const r = document.createElement('div'); r.className = 'row';
                const a = document.createElement('span'); a.textContent = k;
                const b = document.createElement('span'); b.textContent = v; if (mono) b.className = 'mono';
                r.append(a, b); rows.appendChild(r);
            });
            rows.classList.remove('hidden');
        } else rows.classList.add('hidden');
    }

    async function lookup() {
        if (!id) {
            show('idle', 'Verify a Certificate', 'Certificate ID enter karein (jaise SWAP-IND-ABC123) ya certificate ka QR scan karein.');
            el('badge').textContent = '⌕';
            el('lookup').classList.remove('hidden');
            return;
        }

        // 1) Server (cross-device)
        if (API_BASE) {
            try {
                const r = await fetch(`${API_BASE}/api/certificates/verify/${encodeURIComponent(id)}`);
                if (r.ok) {
                    const d = await r.json();
                    const rec = d.certificate || d;
                    if (d.valid === false || String(rec.status).toUpperCase() === 'REVOKED')
                        return show('bad', 'Certificate Revoked', 'Ye certificate ab valid nahi hai.', rec);
                    return show('ok', 'Verified Authentic', 'Ye certificate SkillSwap India ke record se match hota hai.', rec);
                }
                if (r.status === 404) return show('bad', 'Not Found', 'Is ID ka koi certificate SkillSwap records mein nahi mila.');
            } catch (e) { /* fall through to local */ }
        }

        // 2) Local browser record
        try {
            const store = JSON.parse(localStorage.getItem('skillswap_certificates') || '{}');
            if (store[id]) return show('ok', 'Verified Authentic', 'Ye certificate SkillSwap India ke record se match hota hai.', store[id]);
        } catch (e) {}

        show('bad', 'Not Found', 'Is ID ka record nahi mila. Agar certificate asli hai to issuer se contact karein.');
    }
    el('lookup').addEventListener('submit', (e) => {
        e.preventDefault();
        const v = el('idInput').value.trim().toUpperCase();
        if (v) location.search = '?id=' + encodeURIComponent(v);
    });
    lookup();
</script>
</body>
