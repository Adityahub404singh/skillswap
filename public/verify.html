
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10172a" />
  <meta name="description" content="Verify the authenticity of SkillSwap certificates online." />
  <title>Verify Certificate | SkillSwap India</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #f8fafc, #e8edff);
      color: #172033;
      font-family: Inter, Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 490px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px #17203315;
    }

    header {
      padding: 22px;
      background: #10172a;
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 3px solid #d6b56d;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: #7047ef;
      font-size: 24px;
      font-weight: 900;
    }

    header strong { font-size: 19px; }

    header small {
      display: block;
      color: #55dbc9;
      font-size: 10px;
      letter-spacing: 2px;
      margin-top: 4px;
    }

    main {
      padding: 30px 24px;
      text-align: center;
    }

    .badge {
      width: 76px;
      height: 76px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #f1f5f9;
      color: #64748b;
      font-size: 34px;
      font-weight: bold;
    }

    .valid .badge {
      background: #dcfce7;
      color: #15803d;
    }

    .invalid .badge {
      background: #fee2e2;
      color: #dc2626;
    }

    .error .badge {
      background: #fef3c7;
      color: #b45309;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 10px;
    }

    .valid h1 { color: #15803d; }
    .invalid h1 { color: #dc2626; }

    .note {
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 22px;
    }

    .details {
      text-align: left;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 8px 16px;
      margin-top: 20px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #e2e8f0;
      font-size: 13px;
    }

    .detail-row:last-child { border-bottom: 0; }

    .detail-row span:first-child {
      color: #64748b;
    }

    .detail-row span:last-child {
      font-weight: 700;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .mono {
      font-family: monospace;
      color: #7047ef;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 13px;
      font-size: 15px;
      text-align: center;
      text-transform: uppercase;
      outline: none;
    }

    input:focus {
      border-color: #7047ef;
      box-shadow: 0 0 0 3px #7047ef20;
    }

    button, .home {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 13px;
      background: #7047ef;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: block;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .home {
      margin-top: 12px;
      background: #10172a;
    }

    .hidden { display: none !important; }

    .footer {
      padding: 0 24px 24px;
      color: #94a3b8;
      font-size: 11px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="card">

    <header>
      <div class="logo">S</div>
      <div>
        <strong>SkillSwap India</strong>
        <small>CERTIFICATE VERIFICATION</small>
      </div>
    </header>

    <main id="result">

      <div class="badge" id="badge">⌕</div>

      <h1 id="title">Verify a Certificate</h1>

      <p class="note" id="note">
        Enter the certificate ID below or scan its QR code to verify authenticity.
      </p>

      <div class="details hidden" id="details"></div>

      <form id="lookup">

        <input
          id="certId"
          type="text"
          placeholder="SWAP-IND-XXXXXX"
          autocomplete="off"
          maxlength="100"
          required
        />

        <button id="verifyBtn" type="submit">
          Verify Certificate
        </button>

      </form>

      <a class="home" href="/">
        Visit SkillSwap
      </a>

    </main>

    <div class="footer">
      Verification is checked against SkillSwap's official server records.
    </div>

  </div>

  <script>
    // Official SkillSwap backend
    const API_BASE = "https://skillswap-b59w.onrender.com";

    const $ = (id) => document.getElementById(id);

    function setResult(state, title, message, data = null) {

      $("result").className = state;

      $("badge").textContent =
        state === "valid" ? "✓" :
        state === "invalid" ? "✕" :
        state === "error" ? "!" : "⌕";

      $("title").textContent = title;
      $("note").textContent = message;

      const details = $("details");
      details.replaceChildren();

      if (data) {

        const fields = [
          ["Awarded To", data.name || data.fullName],
          ["Skill", data.skill],
          [
            "Track",
            data.role === "teacher"
              ? "Master Mentor / Teacher"
              : data.role ? "Skilled Learner" : null
          ],
          ["Issued On", data.dateStr || data.issuedAt || data.issued_on],
          ["Certificate ID", data.certId || data.certificateId || data.cert_id],
          ["Status", data.status || "UNKNOWN"]
        ];

        fields.forEach(([label, value]) => {

          if (
            value === undefined ||
            value === null ||
            value === ""
          ) return;

          const row = document.createElement("div");
          row.className = "detail-row";

          const left = document.createElement("span");
          left.textContent = label;

          const right = document.createElement("span");
          right.textContent = String(value);

          if (label === "Certificate ID") {
            right.className = "mono";
          }

          row.append(left, right);
          details.appendChild(row);

        });

        details.classList.remove("hidden");

      } else {
        details.classList.add("hidden");
      }
    }

    async function verifyCertificate(id) {

      if (!id) return;

      $("certId").value = id;

      $("verifyBtn").disabled = true;
      $("verifyBtn").textContent = "Checking...";

      setResult(
        "loading",
        "Verifying Certificate...",
        "Checking official SkillSwap server records."
      );

      try {

        const response = await fetch(
          `${API_BASE}/api/certificates/verify/${encodeURIComponent(id)}`,
          {
            method: "GET",
            headers: {
              "Accept": "application/json"
            },
            cache: "no-store"
          }
        );

        // Certificate does not exist
        if (response.status === 404) {

          setResult(
            "invalid",
            "Certificate Not Found",
            "This certificate ID does not exist in SkillSwap's official records."
          );

          return;
        }

        // Other server errors
        if (!response.ok) {
          throw new Error(
            "Verification server returned HTTP " + response.status
          );
        }

        const result = await response.json();

        // Actual backend response:
        // { valid: true/false, certificate: {...} }

        const certificate = result.certificate || result.data || {};

        const status = String(
          certificate.status || ""
        ).toUpperCase();

        // Revoked or tampered certificate
        if (
          result.valid === false ||
          status === "REVOKED" ||
          status === "INVALID"
        ) {

          const revoked = status === "REVOKED";

          setResult(
            "invalid",
            revoked
              ? "Certificate Revoked"
              : "Certificate Invalid",
            revoked
              ? "This certificate has been revoked and is no longer valid."
              : "This certificate failed the official authenticity check.",
            certificate
          );

          return;
        }

        // Only trust the backend's explicit valid:true response
        if (result.valid === true) {

          setResult(
            "valid",
            "Verified Authentic",
            "This certificate matches the official SkillSwap server record.",
            certificate
          );

          return;
        }

        // Unknown response must never be marked authentic
        throw new Error(
          "The server returned an unrecognized verification response."
        );

      } catch (error) {

        console.error(
          "Certificate verification error:",
          error
        );

        setResult(
          "error",
          "Verification Unavailable",
          "We could not reach the verification server. Please check your internet connection and try again."
        );

      } finally {

        $("verifyBtn").disabled = false;
        $("verifyBtn").textContent = "Verify Certificate";

      }
    }

    // Manual certificate ID verification
    $("lookup").addEventListener("submit", (event) => {

      event.preventDefault();

      const id = $("certId").value.trim().toUpperCase();

      if (!id) return;

      const url = new URL(window.location.href);

      url.searchParams.set("id", id);

      history.replaceState(null, "", url);

      verifyCertificate(id);

    });

    // Automatic verification when QR code is scanned
    const params = new URLSearchParams(
      window.location.search
    );

    const certificateId = (
      params.get("id") || ""
    ).trim().toUpperCase();

    if (certificateId) {
      verifyCertificate(certificateId);
    }

  </script>

</body>
</html>
